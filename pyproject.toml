[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttt-format"
version = "0.1.0"
description = "TTT (.ttt) container format — reference implementation (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hbbb1666" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
ttt = "ttt.cli:main"

[tool.setuptools]
packages = ["ttt"]
